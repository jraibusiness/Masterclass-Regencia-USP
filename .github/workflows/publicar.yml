name: Publicar no Apps Script

# Só o ramo principal publica, e só depois da verificação passar.
# Nada aqui cria uma nova implantação do app: `clasp push` atualiza o
# código do projeto. Publicar uma nova versão para o público continua
# sendo um ato deliberado — veja docs/PUBLICAR.md.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.clasp.json'
      - '.github/workflows/publicar.yml'
  workflow_dispatch:
    inputs:
      implantar:
        description: 'Criar também uma nova implantação (deployment)?'
        type: boolean
        default: false

concurrency:
  group: publicar-apps-script
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # A mesma verificação do outro fluxo, de novo: o que barra o deploy
      # tem de rodar no mesmo job que faz o deploy, não num job vizinho.
      - name: Verificar antes de tocar no projeto
        run: node ferramentas/verificar.js

      - name: Instalar o clasp
        run: npm install -g @google/clasp@2.4.2

      # Sem o segredo, a publicação automática apenas não acontece. Falhar
      # aqui encheria a caixa de entrada de e-mail de erro a cada push, por
      # causa de uma configuração opcional — ruído que ninguém lê.
      - name: Autenticar
        id: auth
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "configurado=nao" >> "$GITHUB_OUTPUT"
            echo "::notice::Sem o segredo CLASPRC_JSON — nada foi publicado. \
            Para ligar a publicação automática, veja docs/PUBLICAR.md."
            exit 0
          fi
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          echo "configurado=sim" >> "$GITHUB_OUTPUT"

      - name: Enviar o código
        if: steps.auth.outputs.configurado == 'sim'
        run: clasp push --force

      - name: Nova implantação
        if: steps.auth.outputs.configurado == 'sim' && inputs.implantar
        run: clasp deploy --description "GitHub Actions · ${{ github.sha }}"

      - name: Apagar a credencial do runner
        if: always()
        run: rm -f "$HOME/.clasprc.json"
