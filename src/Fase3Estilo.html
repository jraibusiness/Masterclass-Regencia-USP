<style>
/* ============================================================
   FASE 3 · PREPARO DA OBRA
   Só acrescenta. Nenhuma regra daqui redefine seletor do Estilo —
   o que já funciona continua funcionando exatamente como está.
   ============================================================ */

:root {
  --acerto: #7FB08A;
  --quase:  #E0C56E;
  --erro-q: #E08A6E;
  --vidro:  rgba(10, 10, 10, .82);
}

/* ---------- Código de seis dígitos ---------- */

.codigo {
  display: flex;
  gap: 8px;
  justify-content: space-between;
  margin: 0 0 6px;
}

.codigo__casa {
  flex: 1 1 0;
  min-width: 0;
  height: var(--toque);
  background: var(--onyx-2);
  border: 1px solid var(--onyx-3);
  border-radius: var(--raio);
  text-align: center;
  font-size: 22px;
  font-weight: 500;
  letter-spacing: 0;
  color: var(--alabastro);
  padding: 0;
  transition: border-color .2s, background .2s, transform .12s;
}
.codigo__casa:focus {
  outline: none;
  border-color: var(--ouro);
  background: var(--onyx-3);
  transform: translateY(-1px);
}
.codigo__casa[data-cheia="1"] { border-color: var(--ouro-fraco); }

.reenviar {
  background: none;
  border: 0;
  padding: 10px 0;
  font-size: 12.5px;
  color: var(--prata-3);
  text-decoration: underline;
  text-underline-offset: 3px;
}
.reenviar:hover:not([disabled]) { color: var(--ouro); }
.reenviar[disabled] { color: var(--onyx-3); cursor: default; text-decoration: none; }

/* ---------- Ficha do participante ---------- */

.ficha {
  border: 1px solid var(--onyx-3);
  border-radius: var(--raio);
  padding: 16px 18px;
  margin: 0 0 12px;
  background: var(--onyx-2);
}

.ficha__rubrica {
  font-size: 9.5px;
  font-weight: 500;
  letter-spacing: .22em;
  text-transform: uppercase;
  color: var(--prata-3);
  margin: 0 0 9px;
}

.ficha__obra {
  font-size: 15.5px;
  font-weight: 500;
  line-height: 1.45;
  color: var(--alabastro);
  margin: 0 0 3px;
}

.ficha__trecho {
  font-size: 13px;
  line-height: 1.6;
  color: var(--prata-2);
}

.ficha__linha {
  display: flex;
  gap: 12px;
  padding: 9px 0;
  border-bottom: 1px solid var(--onyx-3);
  font-size: 13.5px;
  line-height: 1.55;
}
.ficha__linha:last-child { border-bottom: 0; }
.ficha__chave {
  flex: 0 0 38%;
  font-size: 10px;
  letter-spacing: .13em;
  text-transform: uppercase;
  color: var(--prata-3);
  padding-top: 2px;
}
.ficha__valor { flex: 1 1 auto; color: var(--prata); min-width: 0; }

/* ---------- Passos do método ---------- */

.passos { list-style: none; margin: 0 0 22px; padding: 0; counter-reset: passo; }

.passos__item {
  counter-increment: passo;
  position: relative;
  padding: 0 0 0 34px;
  margin: 0 0 11px;
  font-size: 14px;
  line-height: 1.55;
  color: var(--prata);
}
.passos__item::before {
  content: counter(passo);
  position: absolute;
  left: 0;
  top: 0;
  width: 22px;
  height: 22px;
  line-height: 22px;
  text-align: center;
  font-size: 10.5px;
  font-weight: 600;
  color: var(--ouro);
  border: 1px solid var(--ouro-fraco);
}

/* ---------- Quiz: cabeçalho e trilho ---------- */

.quiz__topo {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  margin: 0 0 10px;
}

.quiz__contador {
  font-size: 10.5px;
  font-weight: 500;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: var(--prata-3);
}

.quiz__eixo {
  font-size: 10.5px;
  font-weight: 500;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--ouro);
  text-align: right;
  max-width: 58%;
}

.trilho {
  height: 2px;
  background: var(--onyx-3);
  margin: 0 0 22px;
  overflow: hidden;
}
.trilho__cheio {
  height: 100%;
  width: 0;
  background: var(--ouro);
  transition: width .38s cubic-bezier(.22, .61, .36, 1);
}

.quiz__pergunta {
  font-size: 20px;
  font-weight: 300;
  line-height: 1.38;
  color: var(--alabastro);
  margin: 0 0 10px;
  max-width: 26ch;
  text-wrap: balance;
}

.quiz__dica {
  font-size: 13.5px;
  line-height: 1.62;
  color: var(--prata-2);
  margin: 0 0 20px;
  max-width: 40ch;
  text-wrap: balance;
}

/* ---------- Quiz: opções ---------- */

.opcoes { display: flex; flex-direction: column; gap: 9px; margin: 0 0 18px; }

.opcao {
  position: relative;
  width: 100%;
  min-height: var(--toque);
  text-align: left;
  background: var(--onyx-2);
  border: 1px solid var(--onyx-3);
  border-radius: var(--raio);
  padding: 14px 16px 14px 46px;
  font-size: 14.5px;
  line-height: 1.5;
  color: var(--prata);
  transition: border-color .18s, background .18s, color .18s, transform .12s;
}
.opcao:hover { border-color: var(--prata-3); color: var(--alabastro); }
.opcao:active { transform: scale(.988); }

.opcao__marca {
  position: absolute;
  left: 15px;
  top: 50%;
  margin-top: -9px;
  width: 18px;
  height: 18px;
  border: 1px solid var(--prata-3);
  border-radius: 50%;
  transition: border-color .18s, background .18s;
}
.opcoes[data-multipla="1"] .opcao__marca { border-radius: 2px; }

.opcao[aria-pressed="true"] {
  border-color: var(--ouro);
  background: var(--onyx-3);
  color: var(--alabastro);
}
.opcao[aria-pressed="true"] .opcao__marca { background: var(--ouro); border-color: var(--ouro); }
.opcao[aria-pressed="true"] .opcao__marca::after {
  content: '';
  position: absolute;
  left: 5px;
  top: 1px;
  width: 5px;
  height: 10px;
  border: solid var(--onyx);
  border-width: 0 2px 2px 0;
  transform: rotate(45deg);
}

/* ---------- Quiz: barra de ano ---------- */

.barra { margin: 4px 0 20px; }

.barra__valor {
  font-size: 46px;
  font-weight: 300;
  line-height: 1;
  color: var(--alabastro);
  text-align: center;
  font-variant-numeric: tabular-nums;
  margin: 0 0 4px;
  transition: color .2s;
}
.barra__valor[data-mexeu="0"] { color: var(--prata-3); }

.barra__legenda {
  font-size: 11px;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--prata-3);
  text-align: center;
  margin: 0 0 20px;
}

.barra__campo {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 34px;
  background: transparent;
  margin: 0;
}
.barra__campo::-webkit-slider-runnable-track {
  height: 2px;
  background: var(--onyx-3);
}
.barra__campo::-moz-range-track { height: 2px; background: var(--onyx-3); }
.barra__campo::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 30px; height: 30px;
  margin-top: -14px;
  border-radius: 50%;
  background: var(--ouro);
  border: 4px solid var(--onyx);
  box-shadow: 0 0 0 1px var(--ouro-fraco);
  cursor: grab;
}
.barra__campo::-moz-range-thumb {
  width: 22px; height: 22px;
  border-radius: 50%;
  background: var(--ouro);
  border: 4px solid var(--onyx);
  cursor: grab;
}
.barra__campo:active::-webkit-slider-thumb { cursor: grabbing; }

.barra__extremos {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  color: var(--prata-3);
  font-variant-numeric: tabular-nums;
  margin-top: 2px;
}

.barra__passos { display: flex; gap: 8px; justify-content: center; margin-top: 16px; }
.barra__passo {
  min-width: 54px;
  height: 42px;
  background: transparent;
  border: 1px solid var(--onyx-3);
  border-radius: var(--raio);
  color: var(--prata-2);
  font-size: 15px;
}
.barra__passo:hover { border-color: var(--prata-3); color: var(--alabastro); }

/* ---------- Quiz: ligar colunas ---------- */

.ligar { display: flex; gap: 10px; margin: 0 0 8px; }
.ligar__coluna { flex: 1 1 0; display: flex; flex-direction: column; gap: 9px; min-width: 0; }

.ligar__peca {
  width: 100%;
  min-height: 62px;
  background: var(--onyx-2);
  border: 1px solid var(--onyx-3);
  border-radius: var(--raio);
  padding: 11px 12px;
  font-size: 13px;
  line-height: 1.42;
  color: var(--prata);
  text-align: left;
  transition: border-color .18s, background .18s, transform .12s;
}
.ligar__peca:hover { border-color: var(--prata-3); }
.ligar__peca[data-estado="ativa"] {
  border-color: var(--ouro);
  background: var(--onyx-3);
  color: var(--alabastro);
  transform: translateX(2px);
}
.ligar__peca[data-estado="ligada"] {
  border-color: var(--ouro-fraco);
  color: var(--alabastro);
}
.ligar__peca[data-estado="ligada"]::after {
  content: attr(data-par);
  display: block;
  margin-top: 7px;
  font-size: 9.5px;
  font-weight: 600;
  letter-spacing: .14em;
  color: var(--ouro);
}
.ligar__peca[disabled] { opacity: .32; cursor: not-allowed; }

.ligar__ajuda {
  font-size: 12px;
  line-height: 1.6;
  color: var(--prata-3);
  margin: 12px 0 18px;
}

/* ---------- Quiz: ordenar ---------- */

.ordenar { margin: 0 0 18px; }

.ordenar__fila {
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-height: 56px;
  padding: 10px;
  border: 1px dashed var(--onyx-3);
  border-radius: var(--raio);
  margin: 0 0 14px;
  transition: border-color .2s;
}
.ordenar__fila[data-cheia="1"] { border-style: solid; border-color: var(--ouro-fraco); }

.ordenar__vazio {
  font-size: 12.5px;
  color: var(--prata-3);
  text-align: center;
  padding: 12px 6px;
  line-height: 1.6;
}

.ordenar__item {
  position: relative;
  width: 100%;
  text-align: left;
  min-height: 46px;
  background: var(--onyx-2);
  border: 1px solid var(--onyx-3);
  border-radius: var(--raio);
  padding: 11px 14px 11px 40px;
  font-size: 13.5px;
  line-height: 1.45;
  color: var(--prata);
  transition: border-color .18s, transform .14s, opacity .18s;
}
.ordenar__item:hover { border-color: var(--prata-3); color: var(--alabastro); }
.ordenar__item:active { transform: scale(.99); }

.ordenar__fila .ordenar__item { border-color: var(--ouro-fraco); color: var(--alabastro); }
.ordenar__fila .ordenar__item::before {
  content: attr(data-pos);
  position: absolute;
  left: 12px;
  top: 50%;
  margin-top: -9px;
  width: 18px;
  height: 18px;
  line-height: 18px;
  text-align: center;
  font-size: 10px;
  font-weight: 600;
  color: var(--onyx);
  background: var(--ouro);
}

.ordenar__banco { display: flex; flex-direction: column; gap: 8px; }
.ordenar__banco .ordenar__item { padding-left: 14px; }

/* ---------- Quiz: digitar ---------- */

.digitar__campo {
  width: 100%;
  min-height: 64px;
  background: var(--onyx-2);
  border: 1px solid var(--onyx-3);
  border-bottom-width: 2px;
  border-radius: var(--raio);
  padding: 16px 18px;
  font-size: 20px;
  font-weight: 400;
  color: var(--alabastro);
  transition: border-color .2s, background .2s;
}
.digitar__campo:focus { outline: none; border-bottom-color: var(--ouro); background: var(--onyx-3); }

/* ---------- Quiz: rodapé de navegação ---------- */

.quiz__acoes { display: flex; gap: 8px; align-items: stretch; margin-top: 4px; }
.quiz__acoes .btn { flex: 1 1 auto; }
.quiz__acoes .btn--contorno { flex: 0 0 96px; }

.quiz__pular {
  background: none;
  border: 0;
  padding: 12px 0 0;
  width: 100%;
  font-size: 12px;
  color: var(--prata-3);
  text-decoration: underline;
  text-underline-offset: 3px;
}
.quiz__pular:hover { color: var(--prata-2); }

/* ---------- Véu de cálculo ---------- */

.veu {
  position: fixed;
  inset: 0;
  z-index: 60;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 22px;
  padding: 24px;
  background: var(--vidro);
  -webkit-backdrop-filter: blur(14px) saturate(.6);
  backdrop-filter: blur(14px) saturate(.6);
  animation: veuEntra .3s ease both;
}
.veu[hidden] { display: none; }

@keyframes veuEntra { from { opacity: 0; } to { opacity: 1; } }

.veu__texto {
  font-size: 11px;
  letter-spacing: .26em;
  text-transform: uppercase;
  color: var(--prata-2);
  text-align: center;
}

/* Metrônomo: a haste bate no compasso enquanto o servidor corrige. */
.metronomo { width: 46px; height: 60px; position: relative; }
.metronomo__haste {
  position: absolute;
  left: 50%;
  bottom: 6px;
  width: 2px;
  height: 48px;
  margin-left: -1px;
  background: var(--ouro);
  transform-origin: bottom center;
  animation: bater 1.1s ease-in-out infinite;
}
.metronomo__peso {
  position: absolute;
  left: 50%;
  bottom: 0;
  width: 22px;
  height: 3px;
  margin-left: -11px;
  background: var(--prata-3);
}
@keyframes bater {
  0%, 100% { transform: rotate(-19deg); }
  50%      { transform: rotate(19deg); }
}

/* ---------- Placar ---------- */

.placar { text-align: center; padding-top: 10px; }

.placar__numero {
  font-size: 74px;
  font-weight: 300;
  line-height: 1;
  color: var(--alabastro);
  font-variant-numeric: tabular-nums;
  letter-spacing: -.02em;
}
.placar__numero span { font-size: 22px; color: var(--prata-3); letter-spacing: 0; }

.placar__trilho {
  height: 3px;
  background: var(--onyx-3);
  margin: 24px 0 20px;
  overflow: hidden;
}
.placar__cheio {
  height: 100%;
  width: 0;
  background: var(--ouro);
  transition: width 1.05s cubic-bezier(.22, .61, .36, 1);
}

.placar__faixa {
  font-size: 11px;
  font-weight: 500;
  letter-spacing: .22em;
  text-transform: uppercase;
  color: var(--ouro);
  margin: 0 0 12px;
}

.placar__texto {
  font-size: 15px;
  line-height: 1.65;
  color: var(--prata-2);
  max-width: 34ch;
  margin: 0 auto 8px;
  text-align: center;
  text-wrap: balance;
}

.placar__contagem {
  font-size: 12.5px;
  color: var(--prata-3);
  margin: 14px 0 26px;
}

/* ---------- Telas de cerimônia: código, placar e selo ----------

   A regra da casa é não centralizar texto corrido, porque centralizar
   com margem irregular produz aquela última linha de duas palavras.
   Aqui a regra cede: são três telas de uma coisa só — um código, um
   número, um fecho —, o texto é curto e a coluna, estreita. O que se
   centraliza cabe em duas ou três linhas equilibradas pelo text-wrap.
   Fora destas três telas, tudo continua alinhado à esquerda.            */

.tela[data-tela="codigo"] .olho,
.tela[data-tela="codigo"] .titulo,
.tela[data-tela="codigo"] .apoio,
.tela[data-tela="codigo"] .nota,
.tela[data-tela="codigo"] .erro,
.tela[data-tela="selo"] .olho,
.tela[data-tela="selo"] .titulo,
.tela[data-tela="selo"] .apoio,
.tela[data-tela="selo"] .nota,
.tela[data-tela="placar"] .olho,
.tela[data-tela="placar"] .titulo,
.tela[data-tela="placar"] > .nota {
  text-align: center;
  margin-left: auto;
  margin-right: auto;
}

.tela[data-tela="codigo"] .titulo,
.tela[data-tela="selo"] .titulo,
.tela[data-tela="placar"] .titulo { max-width: 24ch; }

.tela[data-tela="codigo"] .apoio,
.tela[data-tela="selo"] .apoio { max-width: 34ch; }

.tela[data-tela="codigo"] .nota,
.tela[data-tela="selo"] .nota,
.tela[data-tela="placar"] > .nota { max-width: 36ch; }

/* O selo e o resumo continuam em bloco, alinhados à esquerda por dentro:
   uma tabela de dados centralizada é ilegível. */
.tela[data-tela="selo"] .ficha,
.tela[data-tela="placar"] .ficha { text-align: left; }

.tela[data-tela="selo"] .selo-ok { margin-left: auto; margin-right: auto; }

/* ---------- Cabeçalho centralizado nas telas do preparo ----------

   A regra da casa protege o texto corrido, que é onde centralizar
   estraga: margem irregular, última linha órfã. Rubrica e título não são
   texto corrido — são uma linha, às vezes duas. Centralizá-los dá eixo à
   página sem custo nenhum de leitura, e o corpo segue à esquerda, que é
   onde ele tem de ficar.                                                */

.tela[data-tela="ficha"] .olho,      .tela[data-tela="ficha"] .titulo,
.tela[data-tela="metodo"] .olho,     .tela[data-tela="metodo"] .titulo,
.tela[data-tela="partituras"] .olho, .tela[data-tela="partituras"] .titulo,
.tela[data-tela="analise"] .olho,    .tela[data-tela="analise"] .titulo,
.tela[data-tela="ensaio"] .olho,     .tela[data-tela="ensaio"] .titulo,
.tela[data-tela="ensaioDados"] .olho,.tela[data-tela="ensaioDados"] .titulo {
  text-align: center;
  margin-left: auto;
  margin-right: auto;
  max-width: 24ch;
}

/* O parágrafo NÃO acompanha. Chegou a acompanhar, e a primeira prova de
   tela mostrou o motivo de a regra existir: seis linhas centralizadas
   viram um bloco de margens irregulares que se lê pior. Rubrica e título
   ao centro dão o eixo; o corpo fica onde o olho o procura. */

.tela[data-tela="ficha"] > div > .olho,
.tela[data-tela="ficha"] > div > .titulo {
  text-align: center;
  margin-left: auto;
  margin-right: auto;
}

/* ---------- Gabarito ---------- */

.gabarito { list-style: none; margin: 0 0 8px; padding: 0; }

.gabarito__item {
  border-top: 1px solid var(--onyx-3);
  padding: 16px 0;
}

.gabarito__cabeca {
  display: flex;
  align-items: center;
  gap: 9px;
  flex-wrap: wrap;
  margin: 0 0 9px;
}

.gabarito__eixo {
  font-size: 9.5px;
  font-weight: 500;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--prata-3);
  flex: 1 1 100%;
}

.gabarito__selo {
  font-size: 9.5px;
  font-weight: 600;
  letter-spacing: .14em;
  text-transform: uppercase;
  padding: 4px 8px;
  border: 1px solid currentColor;
}
.gabarito__selo[data-r="certo"]   { color: var(--acerto); }
.gabarito__selo[data-r="quase"]   { color: var(--quase); }
.gabarito__selo[data-r="errado"]  { color: var(--erro-q); }

.gabarito__pontos { font-size: 12px; color: var(--prata-3); font-variant-numeric: tabular-nums; }

.gabarito__enunciado { font-size: 14.5px; line-height: 1.5; color: var(--alabastro); margin: 0 0 6px; }
.gabarito__sua { font-size: 12.5px; line-height: 1.6; color: var(--prata-3); margin: 0 0 10px; }

.gabarito__resposta {
  font-size: 14px;
  line-height: 1.68;
  color: var(--prata);
  background: var(--onyx-2);
  border-left: 2px solid var(--ouro-fraco);
  padding: 12px 14px;
  margin: 0 0 9px;
}

.gabarito__porque { font-size: 13.5px; line-height: 1.68; color: var(--prata-2); margin: 0 0 9px; }
.gabarito__sugestao { font-size: 13px; line-height: 1.68; color: var(--ouro-fraco); margin: 0 0 9px; }

.gabarito__fonte { font-size: 11px; line-height: 1.6; color: var(--prata-3); }
.gabarito__fonte a { color: var(--prata-2); text-decoration: none; border-bottom: 1px solid var(--onyx-3); }
.gabarito__fonte a:hover { color: var(--ouro); border-bottom-color: var(--ouro-fraco); }

.dobra {
  width: 100%;
  background: none;
  border: 1px solid var(--onyx-3);
  border-radius: var(--raio);
  padding: 14px;
  margin: 8px 0 20px;
  font-size: 12px;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--prata-2);
}
.dobra:hover { border-color: var(--prata-3); color: var(--alabastro); }

/* ---------- Link discreto (pasta de partituras) ---------- */

.linkinho {
  color: var(--ouro);
  text-decoration: none;
  font-weight: 600;
  letter-spacing: .12em;
  border-bottom: 1px solid var(--ouro-fraco);
  padding-bottom: 1px;
}
.linkinho:hover { border-bottom-color: var(--ouro); }

.creditos {
  font-size: 12.5px;

/* ============================================================
   POLIMENTO DAS FASES 1 E 2
   Aditivo e reversível: nada aqui muda estado ou fluxo.
   ============================================================ */

/* Entrada de tela com direção. O Script marca data-sentido no #palco. */
.palco[data-sentido="tras"] .tela[data-ativa="1"] { animation: entrarTras .28s ease both; }
@keyframes entrarTras {
  from { opacity: 0; transform: translateY(-8px); }

}

/* Feedback de toque: o botão responde antes do servidor. */
.btn { transition: background .2s, border-color .2s, color .2s, transform .1s; }
.btn:active:not([disabled]) { transform: scale(.985); }
.cartao:active:not([disabled]) { transform: scale(.994); }

/* A marca de ensaio assenta ao entrar, como quem apoia o carimbo. */

@keyframes assentar {
  from { opacity: 0; transform: translateY(-5px) scale(.9); }
  to   { opacity: 1; transform: none; }
}

/* Os blocos do topo ganham espessura ao serem cumpridos. */
.topo__bloco { transition: color .3s, border-color .3s, border-bottom-width .2s; }

@media (prefers-reduced-motion: reduce) {
